name: 'Kurtosis Assertoor GitHub Action'
description: 'Spins up a ethereum testnet with kurtosis and runs certain tests using assertoor.'
branding:
  icon: 'box'
  color: 'green'
inputs:
  kurtosis_version:
    description: 'Specific version of Kurtosis to install'
    required: false
    default: 'latest'
  kurtosis_extra_args:
    description: 'Extra arguments passed to the kurtosis run command'
    required: false
    default: ''
  kurtosis_backend:
    description: 'Backend to use for Kurtoisis (docker, kubernetes, cloud)'
    required: false
    default: 'docker'
  kurtosis_cloud_api_key:
    description: 'The API key for your Cloud Kurtosis Account (for cloud backend)'
    required: false
    default: ''
  kurtosis_cloud_instance_id:
    description: 'The instance id for the cloud Kurtosis box (for cloud backend)'
    required: false
    default: ''
  kubernetes_config:
    description: 'The base64 encoded kubernetes cluster (for kubernetes backend)'
    required: false
    default: ''
  kubernetes_cluster:
    description: 'The kubernetes cluster name to use (for kubernetes backend)'
    required: false
    default: ''
  kubernetes_storage_class:
    description: 'The kubernetes storage class to use (for kubernetes backend)'
    required: false
    default: ''
  ethereum_package_branch:
    description: 'Branch of the ethereum kurtosis package'
    required: false
    default: 'main'
  ethereum_package_url:
    description: 'URL of the ethereum kurtosis package'
    required: false
    default: 'github.com/ethpandaops/ethereum-package'
  ethereum_package_args:
    description: 'Path to the ethereum package arguments file'
    required: false
    default: ''
  enclave_name:
    description: 'Kurtoisis enclave name to use (default: auto generated with workflow run id)'
    required: false
    default: ''
  enclave_dump:
    description: 'Generate enclave dump after test execution (true/false)'
    required: false
    default: 'true'
  persistent_logs:
    description: 'Run persistent log collection (true/false)'
    required: false
    default: 'false'
  await_assertoor_tests:
    description: 'Await assertoor test completion and return test results (true/false)'
    required: false
    default: 'true'
  docker_cache_enabled:
    description: 'Enable docker cache (true/false)'
    required: false
    default: 'false'
  docker_cache_url:
    description: 'Docker cache URL'
    required: false
    default: ''
  docker_cache_dockerhub_prefix:
    description: 'Docker cache Docker Hub prefix for image names'
    required: false
    default: 'dh'
  docker_cache_github_prefix:
    description: 'Docker cache GitHub prefix for image names'
    required: false
    default: 'gh'
  docker_cache_google_prefix:
    description: 'Docker cache Google prefix for image names'
    required: false
    default: 'gcr'

outputs:
  services:
    description: "Collection of available service urls as JSON string"
    value: ${{ steps.services.outputs.services }}
  test_result:
    description: "Assertoor Test result"
    value: ${{ steps.test_result.outputs.result }}
  test_overview:
    description: "Assertoor Test overview"
    value: ${{ steps.test_result.outputs.test_overview }}
  failed_test_details:
    description: "Failed Assertoor Test details"
    value: ${{ steps.test_result.outputs.failed_test_details }}

runs:
  using: 'composite'
  steps:
  - name: "Install shell dependencies"
    shell: bash
    run: |
      if [ -z "$(which yq)" ]; then
        sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq
      fi

      if [ -z "$(which envsubst)" ]; then
        sudo apt-get update
        sudo apt-get install gettext-base
      fi
  - name: Setup Kurtosis (with cache)
    if: ${{ inputs.docker_cache_enabled == 'true' }}
    shell: bash
    run: |
      # Check if docker cache URL is provided
      cache_url="${{ inputs.docker_cache_url }}"

      if [ ! -z "$cache_url" ]; then
        echo "Installing Kurtosis with pull-through cache support..."
        echo "deb [trusted=yes] https://apt.fury.io/kurtosis-tech/ /" | sudo tee /etc/apt/sources.list.d/kurtosis.list
        sudo apt update
        if [ "${{ inputs.kurtosis_version }}" = "latest" ]; then
          sudo apt install kurtosis-cli
        else
          sudo apt install kurtosis-cli=${{ inputs.kurtosis_version }}
        fi
        kurtosis analytics disable
        echo "$(dirname $(which kurtosis))" >> $GITHUB_PATH

        # Get the installed version and save it as an environment variable
        KURTOSIS_VERSION=$(kurtosis version | grep -o 'Version:[[:space:]]*[^[:space:]]*' | cut -d':' -f2 | tr -d ' ')
        echo "KURTOSIS_VERSION=$KURTOSIS_VERSION" >> $GITHUB_ENV
        echo "Installed Kurtosis version: $KURTOSIS_VERSION"

        # Extract tool versions from Kurtosis source code with fallbacks
        echo "Fetching tool versions from Kurtosis source..."
        echo "Tool versions extracted:"

        TRAEFIK_VERSION=$(curl -sf https://raw.githubusercontent.com/kurtosis-tech/kurtosis/main/container-engine-lib/lib/backend_impls/docker/docker_kurtosis_backend/reverse_proxy_functions/implementations/traefik/consts.go | grep 'containerImage.*=.*"traefik:' | sed 's/.*traefik:\([^"]*\)".*/\1/')
        echo "TRAEFIK_VERSION=$TRAEFIK_VERSION" >> $GITHUB_ENV
        echo "  Traefik: $TRAEFIK_VERSION"

        VECTOR_VERSION=$(curl -sf https://raw.githubusercontent.com/kurtosis-tech/kurtosis/main/container-engine-lib/lib/backend_impls/docker/docker_kurtosis_backend/logs_aggregator_functions/implementations/vector/consts.go | grep 'containerImage.*=.*"timberio/vector:' | sed 's/.*timberio\/vector:\([^"]*\)".*/\1/')
        echo "VECTOR_VERSION=$VECTOR_VERSION" >> $GITHUB_ENV
        echo "  Vector: $VECTOR_VERSION"

        FLUENTBIT_VERSION=$(curl -sf https://raw.githubusercontent.com/kurtosis-tech/kurtosis/main/container-engine-lib/lib/backend_impls/docker/docker_kurtosis_backend/logs_collector_functions/implementations/fluentbit/consts.go | grep 'containerImage.*=.*"fluent/fluent-bit:' | sed 's/.*fluent\/fluent-bit:\([^"]*\)".*/\1/')
        echo "FLUENTBIT_VERSION=$FLUENTBIT_VERSION" >> $GITHUB_ENV
        echo "  Fluent-bit: $FLUENTBIT_VERSION"

        ALPINE_VERSION=$(curl -sf https://raw.githubusercontent.com/kurtosis-tech/kurtosis/main/container-engine-lib/lib/backend_impls/docker/docker_kurtosis_backend/logs_collector_functions/implementations/fluentbit/fluentbit_configuration_creator.go | grep 'configuratorContainerImage.*=.*"alpine:' | sed 's/.*alpine:\([^"]*\)".*/\1/')
        echo "ALPINE_VERSION=$ALPINE_VERSION" >> $GITHUB_ENV
        echo "  Alpine: $ALPINE_VERSION"

        BLACK_VERSION=$(curl -sf https://raw.githubusercontent.com/kurtosis-tech/kurtosis/78041d2b84d2e56a5bf84d70e3501dfa4056c4b6/cli/cli/commands/lint/lint.go | grep 'pyBlackDockerImage.*=.*"pyfound/black:' | sed 's/.*pyfound\/black:\([^"]*\)".*/\1/')
        echo "BLACK_VERSION=$BLACK_VERSION" >> $GITHUB_ENV
        echo "  Black: $BLACK_VERSION"

        CURL_JQ_VERSION=$(curl -sf https://raw.githubusercontent.com/kurtosis-tech/kurtosis/78041d2b84d2e56a5bf84d70e3501dfa4056c4b6/core/server/api_container/server/startosis_engine/kurtosis_instruction/tasks/run_sh.go | grep 'badouralix/curl-jq:' | sed 's/.*badouralix\/curl-jq:\([^"]*\)".*/\1/')
        echo "CURL_JQ_VERSION=$CURL_JQ_VERSION" >> $GITHUB_ENV
        echo "  Curl-jq: $CURL_JQ_VERSION"

        EGG_VERSION=$(curl -sf https://raw.githubusercontent.com/ethpandaops/ethereum-package/${{ inputs.ethereum_package_branch }}/src/package_io/constants.star | grep -A1 'DEFAULT_ETHEREUM_GENESIS_GENERATOR_IMAGE = (' | grep 'ethpandaops/ethereum-genesis-generator:' | sed 's/.*ethpandaops\/ethereum-genesis-generator:\([^"]*\)".*/\1/')
        echo "EGG_VERSION=$EGG_VERSION" >> $GITHUB_ENV
        echo "  EGG: $EGG_VERSION"

        LIGHTHOUSE_VERSION=$(curl -sf https://raw.githubusercontent.com/ethpandaops/ethereum-package/${{ inputs.ethereum_package_branch }}/src/package_io/input_parser.star | grep '"lighthouse": "sigp/lighthouse:' | head -1 | sed 's/.*sigp\/lighthouse:\([^"]*\)".*/\1/')
        echo "LIGHTHOUSE_VERSION=$LIGHTHOUSE_VERSION" >> $GITHUB_ENV
        echo "  Lighthouse: $LIGHTHOUSE_VERSION"

        CLIENT_GO_VERSION=$(curl -sf https://raw.githubusercontent.com/ethpandaops/ethereum-package/${{ inputs.ethereum_package_branch }}/src/package_io/input_parser.star | grep '"geth": "ethereum/client-go:' | sed 's/.*ethereum\/client-go:\([^"]*\)".*/\1/')
        echo "CLIENT_GO_VERSION=$CLIENT_GO_VERSION" >> $GITHUB_ENV
        echo "  Client-go: $CLIENT_GO_VERSION"

        VAL_TOOLS_VERSION=$(curl -sf https://raw.githubusercontent.com/ethpandaops/ethereum-package/${{ inputs.ethereum_package_branch }}/src/prelaunch_data_generator/validator_keystores/validator_keystore_generator.star | grep 'ETH_VAL_TOOLS_IMAGE = "protolambda/eth2-val-tools:' | sed 's/.*protolambda\/eth2-val-tools:\([^"]*\)".*/\1/')
        echo "VAL_TOOLS_VERSION=$VAL_TOOLS_VERSION" >> $GITHUB_ENV
        echo "  Val-tools: $VAL_TOOLS_VERSION"
      else
        echo "Docker cache parameters provided but not enabled, using regular installation..."
        echo "deb [trusted=yes] https://apt.fury.io/kurtosis-tech/ /" | sudo tee /etc/apt/sources.list.d/kurtosis.list
        sudo apt update
        if [ "${{ inputs.kurtosis_version }}" = "latest" ]; then
          sudo apt install kurtosis-cli
        else
          sudo apt install kurtosis-cli=${{ inputs.kurtosis_version }}
        fi
        kurtosis analytics disable
        echo "$(dirname $(which kurtosis))" >> $GITHUB_PATH
      fi

  - name: Setup Kurtosis (regular)
    if: ${{ inputs.docker_cache_enabled != 'true' }}
    shell: bash
    run: |
      echo "deb [trusted=yes] https://apt.fury.io/kurtosis-tech/ /" | sudo tee /etc/apt/sources.list.d/kurtosis.list
      sudo apt update
      if [ "${{ inputs.kurtosis_version }}" = "latest" ]; then
        sudo apt install kurtosis-cli
      else
        sudo apt install kurtosis-cli=${{ inputs.kurtosis_version }}
      fi
      kurtosis analytics disable
      echo "$(dirname $(which kurtosis))" >> $GITHUB_PATH

  - name: Pull images
    if: ${{ inputs.docker_cache_enabled == 'true' }}
    shell: bash
    run: |
      # Check if docker cache URL is provided
      cache_url="${{ inputs.docker_cache_url }}"

      if [ ! -z "$cache_url" ]; then
        # Pull images in parallel
        echo "Starting parallel docker pulls from cache URL: $cache_url"
        docker pull $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/kurtosistech/engine:$KURTOSIS_VERSION &
        docker pull $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/kurtosistech/files-artifacts-expander:$KURTOSIS_VERSION &
        docker pull $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/kurtosistech/core:$KURTOSIS_VERSION &
        docker pull $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/timberio/vector:$VECTOR_VERSION &
        docker pull $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/fluent/fluent-bit:$FLUENTBIT_VERSION &
        docker pull $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/alpine:$ALPINE_VERSION &
        docker pull $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/traefik:$TRAEFIK_VERSION &
        docker pull $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/badouralix/curl-jq:$CURL_JQ_VERSION &
        docker pull $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/pyfound/black:$BLACK_VERSION &
        docker pull $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/ethpandaops/ethereum-genesis-generator:$EGG_VERSION &
        docker pull $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/sigp/lighthouse:$LIGHTHOUSE_VERSION &
        docker pull $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/ethereum/client-go:$CLIENT_GO_VERSION &
        docker pull $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/protolambda/eth2-val-tools:$VAL_TOOLS_VERSION &

        # Wait for all pulls to complete
        wait
        echo "All docker pulls completed"

        # Tag images sequentially (fast operation)
        docker tag $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/kurtosistech/engine:$KURTOSIS_VERSION kurtosistech/engine:$KURTOSIS_VERSION
        docker tag $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/kurtosistech/files-artifacts-expander:$KURTOSIS_VERSION kurtosistech/files-artifacts-expander:$KURTOSIS_VERSION
        docker tag $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/kurtosistech/core:$KURTOSIS_VERSION kurtosistech/core:$KURTOSIS_VERSION
        docker tag $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/timberio/vector:$VECTOR_VERSION timberio/vector:$VECTOR_VERSION
        docker tag $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/fluent/fluent-bit:$FLUENTBIT_VERSION fluent/fluent-bit:$FLUENTBIT_VERSION
        docker tag $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/alpine:$ALPINE_VERSION alpine:$ALPINE_VERSION
        docker tag $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/traefik:$TRAEFIK_VERSION traefik:$TRAEFIK_VERSION
        docker tag $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/badouralix/curl-jq:$CURL_JQ_VERSION badouralix/curl-jq:$CURL_JQ_VERSION
        docker tag $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/pyfound/black:$BLACK_VERSION pyfound/black:$BLACK_VERSION
        docker tag $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/ethpandaops/ethereum-genesis-generator:$EGG_VERSION ethpandaops/ethereum-genesis-generator:$EGG_VERSION
        docker tag $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/sigp/lighthouse:$LIGHTHOUSE_VERSION sigp/lighthouse:$LIGHTHOUSE_VERSION
        docker tag $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/ethereum/client-go:$CLIENT_GO_VERSION ethereum/client-go:$CLIENT_GO_VERSION
        docker tag $cache_url/${{ inputs.docker_cache_dockerhub_prefix }}/protolambda/eth2-val-tools:$VAL_TOOLS_VERSION protolambda/eth2-val-tools:$VAL_TOOLS_VERSION
      else
        echo "Docker cache not enabled, skipping image pulls"
      fi

  # cloud backend configuration
  - name: Configure kurtosis to use kurtosis cloud
    if: ${{ inputs.kurtosis_backend == 'cloud' }}
    run: |
      n=0
      until [ "$n" -ge 3 ]
      do
        kurtosis cloud load ${CLOUD_INSTANCE_ID} && break
        n=$((n+1))
        echo "Retry $n/3..."
        sleep 5
      done
      kurtosis engine restart
    env:
      KURTOSIS_CLOUD_API_KEY: ${{ inputs.kurtosis_cloud_api_key }}
      CLOUD_INSTANCE_ID: ${{ inputs.kurtosis_cloud_instance_id }}
    shell: bash

  # kubernetes backend configuration
  - name: Setup kubectl
    if: ${{ inputs.kurtosis_backend == 'kubernetes' }}
    uses: tale/kubectl-action@a3b800d623aebc530384fe67de1b337332e23290 # v1.4.0
    with:
      base64-kube-config: ${{ inputs.kubernetes_config }}
  - name: Configure kurtosis to use kubernetes backend
    if: ${{ inputs.kurtosis_backend == 'kubernetes' }}
    shell: bash
    run: |
      kubectl config use-context ${{ inputs.kubernetes_cluster }}
      kubectl get nodes
      echo "Kubernetes engine is ready!"

      kurtosis_config=$(kurtosis config path)
      echo "config-version: 2" > $kurtosis_config
      echo "should-send-metrics: false" >> $kurtosis_config
      echo "kurtosis-clusters:" >> $kurtosis_config
      echo "  docker:" >> $kurtosis_config
      echo "    type: \"docker\"" >> $kurtosis_config
      echo "  cloud:" >> $kurtosis_config
      echo "    type: \"kubernetes\"" >> $kurtosis_config
      echo "    config:" >> $kurtosis_config
      echo "      kubernetes-cluster-name: \"${{ inputs.kubernetes_cluster }}\"" >> $kurtosis_config
      echo "      storage-class: \"${{ inputs.kubernetes_storage_class }}\"" >> $kurtosis_config
      echo "      enclave-size-in-megabytes: 200" >> $kurtosis_config

      cat $kurtosis_config

      kurtosis cluster set cloud
  - name: Run kurtosis gateway in background
    uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
    if: ${{ inputs.kurtosis_backend == 'kubernetes' }}
    with:
      run: |
        kurtosis gateway
      wait-on: |
        tcp:localhost:9710
  - name: Check kurtosis engine in kubernetes cluster
    if: ${{ inputs.kurtosis_backend == 'kubernetes' }}
    shell: bash
    run: |
      kurtosis engine status
      kurtosis enclave ls || ( kurtosis engine restart && kurtosis enclave ls )

  # start kurtosis testnet
  - name: Run kurtosis
    shell: bash
    id: kurtosis
    run: |
      kurtosis_package="${{ inputs.ethereum_package_url }}"
      if [ ! -z "${{ inputs.ethereum_package_branch }}" ]; then
        kurtosis_package="${kurtosis_package}@${{ inputs.ethereum_package_branch }}"
      fi

      enclave_name="${{ inputs.enclave_name }}"
      if [ -z "$enclave_name" ]; then
        enclave_name="gh-${{ github.run_id }}"
      fi
      echo "enclave_name=${enclave_name}" >> $GITHUB_OUTPUT

      tempdir="${{ runner.temp }}/$enclave_name"
      mkdir -p $tempdir
      echo "tempdir=${tempdir}" >> $GITHUB_OUTPUT

      kurtosis_args="--enclave $enclave_name"
      if [ ! -z "${{ inputs.ethereum_package_args }}" ]; then
        kurtosis_args="$kurtosis_args --args-file ${{ inputs.ethereum_package_args }}"
      fi
      if [ ! -z "${{ inputs.kurtosis_extra_args }}" ]; then
        kurtosis_args="$kurtosis_args ${{ inputs.kurtosis_extra_args }}"
      fi

      kurtosis run $kurtosis_package $kurtosis_args | tee $tempdir/kurtosis_output.txt

  # kubernets logs are non-persistent, so we have to keep collecting logs of all running pods locally.
  - name: Create persistent log collection script for kubernetes
    uses: DamianReeves/write-file-action@1d019960841941be46b139298996df6f139cc7a4 # dependabot/npm_and_yarn/undici-5.28.5-1d01996
    with:
      path: ${{ steps.kurtosis.outputs.tempdir }}/log_collector.sh
      write-mode: overwrite
      contents: |
        #!/bin/bash

        namespace="kt-${{ steps.kurtosis.outputs.enclave_name }}"
        tempdir="${{ steps.kurtosis.outputs.tempdir }}"
        mkdir -p $tempdir/logs

        collect_pod_logs() {
          podname="$1"
          logpath="$tempdir/logs/$podname"
          if [ -d $logpath ]; then
            return
          fi

          mkdir $logpath
          touch $logpath/full_logs.log

          echo "Starting log collection for $podname"
          since_time=""

          while true
          do
            podstatus=$(kubectl -n $namespace get pod $podname)
            if [ ! -z "$(echo "$podstatus" | grep "not found")" ]; then
              break
            fi

            old_logsize="$(stat --printf="%s" $logpath/full_logs.log)"

            extra_args=""
            if [ ! -z "$since_time" ]; then
              extra_args="--since-time $since_time"
            fi

            kubectl -n $namespace logs -f $extra_args --all-containers $podname >> $logpath/full_logs.log || true

            new_logsize="$(stat --printf="%s" $logpath/full_logs.log)"
            if [ "$new_logsize" -gt "$old_logsize" ]; then
              since_time="$(date --iso-8601=seconds)"
              echo "" >> $logpath/full_logs.log
              echo "### log collection interrupted at $since_time" >> $logpath/full_logs.log
              echo "" >> $logpath/full_logs.log
            fi
            sleep 10
          done

          echo "Completed log collection for $podname"
        }

        while read line; do
          podname=$(echo "$line" | sed 's/^\([^ ]*\) .*$/\1/')
          echo "pod name: $podname"

          collect_pod_logs $podname &
        done <<< $(kubectl -n $namespace get pods | tail -n +2)

        sleep 10
        echo "ok" > $tempdir/log_collect.txt

        sleep 60
        FAIL=0
        for job in `jobs -p`; do
          echo $job
          wait $job || let "FAIL+=1"
        done
  - name: Run persistent log collection for kubernetes in background
    uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
    if: ${{ inputs.kurtosis_backend == 'kubernetes' && inputs.persistent_logs == 'true' }}
    with:
      run: |
        chmod 755 ${{ steps.kurtosis.outputs.tempdir }}/log_collector.sh && ${{ steps.kurtosis.outputs.tempdir }}/log_collector.sh
      wait-on: |
        file:${{ steps.kurtosis.outputs.tempdir }}/log_collect.txt
      tail: true
      log-output-resume: stderr,stdout
      log-output-if: failure,success

  # extract assertoor url & wait for tests
  - name: Get service links
    shell: bash
    id: services
    run: |
      enclave_details=$(kurtosis enclave inspect ${{ steps.kurtosis.outputs.enclave_name }})

      services_json="{}"
      current_service=""
      while read line; do
        if [ ! -z "$(echo "$line" | grep -E "^[0-9a-f]+")" ]; then
          current_service="$(echo "$line" | sed 's/^[^ ]* *\([^ ]*\) .*$/\1/')"
          portmap_line="$(echo "$line" | sed 's/^[^ ]* *[^ ]* *\(.*\) \+[^ ]\+$/\1/')"
        else
          portmap_line="$(echo "$line" | sed 's/^ *\([^ ]\)/\1/')"
        fi
        if [ -z "$current_service" ]; then
          echo "invalid service entry: $line"
          continue
        fi
        if [ -z "$portmap_line" ]; then
          continue
        fi

        if [ ! -z "$(echo "$portmap_line" | grep "<none>")" ]; then
          continue
        else
          port_name="$(echo "$portmap_line" | sed 's/^\([^:]*\).*$/\1/')"
          port_descr="$(echo "$portmap_line" | sed 's/^[^:]*: *\([^ ]*\).*$/\1/')"
          if [ -z "$(echo "$portmap_line" | grep " -> ")" ]; then
            port_url=""
          else
            port_url="$(echo "$portmap_line" | sed 's/^[^>]*> *\([^ ]*\) *$/\1/')"
          fi
        fi

        services_json="$(echo "$services_json" | jq ".\"${current_service}\".\"${port_name}\"|={url:\"${port_url}\",desc:\"${port_descr}\"}")"
      done <<< $(echo "$enclave_details" | awk '/User Services/,0' | tail -n +3)

      echo "Services:"
      echo "$services_json" | yq -p json -o yaml

      echo "services<<EOF" >> $GITHUB_OUTPUT
      echo "$services_json" >> $GITHUB_OUTPUT
      echo "EOF" >> $GITHUB_OUTPUT

      assertoor_url=$(echo "$services_json" | jq -r '.assertoor.http.url // ""')
      echo "assertoor_url=${assertoor_url}" >> $GITHUB_OUTPUT
  - name: Assertoor Status Check
    id: test_result
    uses: ethpandaops/assertoor-github-action@2c0747b6d798a3a646d4339c85258940b8fa66ff # v1
    if: ${{ inputs.await_assertoor_tests == 'true' && steps.services.outputs.assertoor_url != '' }}
    with:
      kurtosis_enclave_name: ${{ steps.kurtosis.outputs.enclave_name }}
      assertoor_api_url: ${{ steps.services.outputs.assertoor_url }}

  # generate enclave dump
  - name: Generate enclave dump
    if: ${{ always() && inputs.enclave_dump == 'true' }}
    shell: bash
    run: |
      tempdir="${{ steps.kurtosis.outputs.tempdir }}"
      mkdir -p $tempdir/dump
      if [ ! -z "${{ inputs.ethereum_package_args }}" ]; then
        cp "${{ inputs.ethereum_package_args }}" $tempdir/dump/kurtosis-params.yaml
      fi
      if [ -f $tempdir/kurtosis_output.txt ]; then
        cp $tempdir/kurtosis_output.txt $tempdir/dump/kurtosis_output.log
      fi
      cd $tempdir/dump
      kurtosis enclave dump ${{ steps.kurtosis.outputs.enclave_name }}

      if [ "${{ inputs.persistent_logs }}" == "true" ] && [ -d $tempdir/logs ]; then
        # add full logfiles to enclave dump
        for podname in $tempdir/logs/* ; do
          echo "copy persisted logs from $podname"
          cp $podname/*.log $tempdir/dump/${{ steps.kurtosis.outputs.enclave_name }}--*/${podname##*/}/ || true
        done
      fi
  - name: Upload dump artifact
    if: ${{ always() && inputs.enclave_dump == 'true' }}
    uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
    with:
      name: "enclave-dump-${{ steps.kurtosis.outputs.enclave_name }}"
      path: "${{ steps.kurtosis.outputs.tempdir }}/dump"

  # remove kurtosis enclave
  - name: Remove kurtosis enclave
    uses: gacts/run-and-post-run@d803f6920adc9a47eeac4cb6c93dbc2e2890c684 # v1.4.2
    if: ${{ always() }}
    with:
      post: |
        kurtosis enclave rm -f ${{ steps.kurtosis.outputs.enclave_name }} || true

  - name: Return test result
    if: ${{ inputs.await_assertoor_tests == 'true' && steps.services.outputs.assertoor_url != '' }}
    shell: bash
    run: |
      test_result="${{ steps.test_result.outputs.result }}"
      test_status=$(
      cat <<"EOF"
      ${{ steps.test_result.outputs.test_overview }}
      EOF
      )
      failed_test_status=$(
      cat <<"EOF"
      ${{ steps.test_result.outputs.failed_test_details }}
      EOF
      )
      chatgpt_summary=$(
      cat <<"EOF"
      ${{ steps.chatgpt.outputs.summary }}
      EOF
      )

      echo "Test Result:  $test_result"
      echo "$test_status"

      if ! [ "$test_result" == "success" ]; then
        echo ""
        echo "Failed Test Task Status:"
        echo "$failed_test_status"

        exit 1 # fail action
      fi
